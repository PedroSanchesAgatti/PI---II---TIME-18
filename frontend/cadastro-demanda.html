<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro de Demanda</title>

    <!-- Autor: Julia Guarnieri -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/cadastro-demanda.css">
</head>

<body>

    <header class="cabecalho">

        <div class="logo">
            <h1>Sistema de Demandas</h1>
        </div>

        <nav class="menu">
            <a href="login.html">Login</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="demandas.html">Demandas</a>
            <a href="cadastro-demanda.html">Nova Demanda</a>
        </nav>

    </header>


    <main class="conteudo">

        <section class="formulario-demanda">

            <h2>Cadastro de Demanda</h2>

            <p class="descricao-pagina">
                Preencha as informações da nova demanda.
            </p>

            <!-- Mensagem de erro ou sucesso -->
            <p
                id="mensagem-cadastro"
                role="status"
                aria-live="polite"
                hidden
            ></p>


            <form id="form-cadastro-demanda">

                <!-- TÍTULO -->
                <div class="campo">

                    <label for="titulo">
                        Título da demanda
                    </label>

                    <input
                        type="text"
                        id="titulo"
                        name="titulo"
                        placeholder="Digite o título da demanda"
                        required
                    >

                </div>


                <!-- DESCRIÇÃO -->
                <div class="campo">

                    <label for="descricao">
                        Descrição
                    </label>

                    <textarea
                        id="descricao"
                        name="descricao"
                        rows="5"
                        placeholder="Descreva a demanda"
                        required
                    ></textarea>

                </div>


                <!-- TIPO E PROJETO -->
                <div class="linha-campos">

                    <div class="campo">

                        <label for="tipo">
                            Tipo da demanda
                        </label>

                        <select
                            id="tipo"
                            name="tipo"
                            required
                        >
                            <option value="">
                                Selecione
                            </option>

                            <option value="Tarefa">
                                Tarefa
                            </option>

                            <option value="Defeito">
                                Defeito
                            </option>

                            <option value="Melhoria">
                                Melhoria
                            </option>

                            <option value="Documentação">
                                Documentação
                            </option>
                        </select>

                    </div>


                    <div class="campo">

                        <label for="projeto">
                            Projeto associado
                        </label>

                        <select
                            id="projeto"
                            name="projeto"
                            required
                        >
                            <option value="">
                                Selecione
                            </option>

                            <option value="1">
                                Sistema de Demandas
                            </option>

                            <option value="2">
                                Portal Acadêmico
                            </option>
                        </select>

                    </div>

                </div>


                <!-- PRIORIDADE E RESPONSÁVEL -->
                <div class="linha-campos">

                    <div class="campo">

                        <label for="prioridade">
                            Prioridade
                        </label>

                        <select
                            id="prioridade"
                            name="prioridade"
                            required
                        >
                            <option value="">
                                Selecione
                            </option>

                            <option value="Crítica">
                                Crítica
                            </option>

                            <option value="Alta">
                                Alta
                            </option>

                            <option value="Média">
                                Média
                            </option>

                            <option value="Baixa">
                                Baixa
                            </option>
                        </select>

                    </div>


                    <div class="campo">

                        <label for="responsavel">
                            Responsável
                        </label>

                        <select
                            id="responsavel"
                            name="responsavel"
                        >
                            <option value="">
                                Não definido
                            </option>

                            <option value="1">
                                Administrador
                            </option>

                            <option value="2">
                                João
                            </option>

                            <option value="3">
                                Maria
                            </option>
                        </select>

                    </div>

                </div>


                <!-- STATUS E PRAZO -->
                <div class="linha-campos">

                    <div class="campo">

                        <label for="status">
                            Status
                        </label>

                        <input
                            type="text"
                            id="status"
                            value="Aberta"
                            disabled
                        >

                        <small>
                            Novas demandas iniciam com status Aberta.
                        </small>

                    </div>


                    <div class="campo">

                        <label for="prazo">
                            Prazo de finalização
                        </label>

                        <input
                            type="date"
                            id="prazo"
                            name="prazo"
                        >

                    </div>

                </div>


                <!-- INFORMAÇÕES AUTOMÁTICAS -->
                <div class="informacoes-automaticas">

                    <div class="informacao">

                        <span>Data de criação</span>

                        <strong>
                            Registrada automaticamente pelo sistema
                        </strong>

                    </div>


                    <div class="informacao">

                        <span>Última atualização</span>

                        <strong>
                            Atualizada automaticamente pelo sistema
                        </strong>

                    </div>

                </div>


                <!-- BOTÕES -->
                <div class="acoes-formulario">

                    <a
                        href="demandas.html"
                        class="botao botao-cancelar"
                    >
                        Cancelar
                    </a>

                    <button
                        type="submit"
                        class="botao botao-salvar"
                        id="botao-salvar"
                    >
                        Salvar demanda
                    </button>

                </div>

            </form>

        </section>

    </main>


    <!-- IMPORTANTE: carrega o JavaScript -->
    <script src="js/cadastro-demanda.js" defer></script>

</body>

</html>
