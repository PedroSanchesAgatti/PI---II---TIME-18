
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Autor: Pedro Sanches -->
    <link rel="stylesheet" href="css/login.css">

</head>

<body>

    <header class="cabecalho">

        <div class="logo">
            <h1>Sistema de Demandas</h1>
        </div>

    </header>

    <main class="conteudo">

        <section class="formulario-login">

            <h2>Login</h2>

            <form id="login-form">

                <div class="campo">

                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite o e-mail"
                        required
                    >

                </div>

                <div class="campo">

                    <label for="password">Senha</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Digite a senha"
                        maxlength="64"
                        required
                    >

                    <button
                        type="button"
                        id="mostrarSenha"
                        aria-label="Mostrar senha"
                        aria-pressed="false"
                    >
                        Mostrar senha
                    </button>

                    <small id="contadorSenha">
                        0/64 caracteres
                    </small>

                    <div class="requisitos-senha">

                        <div class="requisito invalido" id="req-tamanho">
                            <span>✕</span>
                            Mínimo de 8 caracteres
                        </div>

                        <div class="requisito invalido" id="req-maiuscula">
                            <span>✕</span>
                            Letra maiúscula
                        </div>

                        <div class="requisito invalido" id="req-minuscula">
                            <span>✕</span>
                            Letra minúscula
                        </div>

                        <div class="requisito invalido" id="req-numero">
                            <span>✕</span>
                            Pelo menos um número
                        </div>

                        <div class="requisito invalido" id="req-especial">
                            <span>✕</span>
                            Caractere especial
                        </div>

                    </div>

                    <small id="forcaSenha">
                        Força da senha: -
                    </small>

                </div>

                <p
                    id="mensagem-login"
                    role="status"
                    aria-live="polite"
                    hidden
                ></p>

                <div class="acoes-formulario">

                    <button
                        type="submit"
                        class="botao botao-salvar"
                        id="botao-entrar"
                    >
                        Entrar
                    </button>

                </div>

            </form>

        </section>

    </main>

    <script src="js/login.js" defer></script>

</body>

</html>
