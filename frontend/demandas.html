<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listagem de Demandas</title>
    <!--Autor: Larissa Quito-->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/demandas.css">
    <script src="js/demandas.js" defer></script>
</head>
<body>
    <header class="cabecalho">
        <div class="logo"><h1>Sistema de Demandas</h1></div>
        <nav class="menu">
            <a href="login.html">Login</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="demandas.html">Demandas</a>
            <a href="cadastro-demanda.html">Nova Demanda</a>
        </nav>
    </header>

    <main class="conteudo">
        <h2>Listagem de Demandas</h2>

        <section class="filtros">
            <div class="campo">
                <label for="status">Status</label>
                <select id="status">
                    <option value="">Todos</option>
                    <option value="Aberta">Aberta</option>
                    <option value="Em andamento">Em andamento</option>
                    <option value="Em revisão">Em revisão</option>
                    <option value="Concluída">Concluída</option>
                    <option value="Cancelada">Cancelada</option>
                </select>
                <div id="erroStatus" class="text-danger small"></div>
            </div>

            <div class="campo">
                <label for="prioridade">Prioridade</label>
                <select id="prioridade">
                    <option value="">Todas</option>
                    <option value="Crítica">Crítica</option>
                    <option value="Alta">Alta</option>
                    <option value="Média">Média</option>
                    <option value="Baixa">Baixa</option>
                </select>
                <div id="erroPrioridade" class="text-danger small"></div>
            </div>

            <div class="campo">
                <label for="tipo">Tipo</label>
                <select id="tipo">
                    <option value="">Todos</option>
                    <option value="Tarefa">Tarefa</option>
                    <option value="Defeito">Defeito</option>
                    <option value="Melhoria">Melhoria</option>
                    <option value="Documentação">Documentação</option>
                </select>
            </div>

            <div class="campo">
                <label for="busca">Buscar</label>
                <input id="busca" type="text" placeholder="Buscar por título ou descrição">
                <div id="erroBusca" class="text-danger small"></div>
            </div>

            <div class="campo">
                <label for="ordenarPor">Ordenar por</label>
                <select id="ordenarPor">
                    <option value="dataCriacao">Data de criação</option>
                    <option value="prazo">Prazo</option>
                    <option value="prioridade">Prioridade</option>
                    <option value="status">Status</option>
                </select>
            </div>

            <div class="campo">
                <label for="ordem">Ordem</label>
                <select id="ordem">
                    <option value="desc">Decrescente</option>
                    <option value="asc">Crescente</option>
                </select>
            </div>

            <button class="botao botao-salvar" id="botao-filtrar">Filtrar</button>
        </section>

        <p id="mensagem-lista" role="status" aria-live="polite"></p>

        <section class="lista-demandas">
            <table>
                <thead>
                    <tr>
                        <th>Título</th>
                        <th>Tipo</th>
                        <th>Prioridade</th>
                        <th>Status</th>
                        <th>Projeto</th>
                        <th>Responsável</th>
                        <th>Criação</th>
                        <th>Prazo</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-demandas"></tbody>
            </table>
        </section>
    </main>
</body>
</html>
