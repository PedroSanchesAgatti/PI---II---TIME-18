<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Autor: Pedro Sanches -->
    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <header class="cabecalho">

        <div class="logo">
            <h1>Sistema de Demandas</h1>
        </div>

    </header>

    <main class="conteudo">

        <section class="formulario-login">

            <h2>Login</h2>

            <form id="login-form">

                <!-- Usuário -->
                <div class="campo">

                    <label for="user">Usuário</label>

                    <input
                        type="text"
                        id="user"
                        name="user"
                        placeholder="Digite o usuário"
                        required
                    >

                </div>

                <!-- E-mail -->
                <div class="campo">

                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite o e-mail"
                        required
                    >

                </div>

                <!-- Senha -->
                <div class="campo">

                    <label for="password">Senha</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Digite a senha"
                        required
                    >

                    <button
                        type="button"
                        id="mostrarSenha"
                    >
                        Mostrar senha
                    </button>

                    <small id="contadorSenha">0/64</small>

                    <small id="forcaSenha">Força da senha: -</small>

                </div>

                <!-- Botão -->
                <div class="acoes-formulario">

                    <button
                        type="submit"
                        class="botao botao-salvar"
                    >
                        Logar
                    </button>

                </div>

            </form>

        </section>

    </main>

    <script src="js/login.js"></script>

</body>

</html>
