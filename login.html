<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Autor: Pedro Sanches -->
    <link rel="stylesheet" href="css/login.css">
</head>

<body>
    <header class="cabecalho">

        <div class="logo">
            <h1>Sistema de Demandas</h1>
        </div>
    </header>
    <main class="conteudo">
        <section class="formulario-login">
            <h2 style="justify-self: center;">Login</h2>
            <form>
                <div class="campo">
                    <label for="user">Usuario</label>
                    <input type="text" id="user" name="user" placeholder="Digite o ususario" required>
                </div>
                <div class="campo">
                    <label for="password">Senha</label>
                    <input type="password" id="password" name="password" placeholder="Digite a senha" required>
                </div>
                <div class="acoes-formulario">
                    <a href=""><p></p></a>

                    <button type="submit" class="botao botao-salvar">
                        Logar
                    </button>

                </div>
            </form>

        </section>

    </main>
</body>

</html>
